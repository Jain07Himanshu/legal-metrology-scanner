# Legal Metrology (Packaged Commodities) Rules, 2011 & Legal Metrology Act, 2009
# Declarative Rules Configuration & Statutory Penalties

rules:
  - id: "RULE_6_1_A"
    name: "Manufacturer / Packer / Importer Identity & Address"
    clause: "Rule 6(1)(a)"
    act_section: "Section 36(1)"
    category: "Mandatory Declaration"
    importance: "CRITICAL"
    description: "Every package shall bear the name and complete address of the manufacturer, or packer, or importer."
    requirements:
      - "Must contain prefix indicating role: 'Manufactured by', 'Packed by', 'Mkt by', or 'Imported by'"
      - "Must provide complete postal address including premise/street, city, state and valid 6-digit postal PIN code"
    penalty: "Penalty under Section 36(1) of Legal Metrology Act, 2009: Fine up to ₹25,000 for first offence, ₹50,000 for second, and up to ₹1,00,000 or imprisonment up to 1 year for subsequent offences."

  - id: "RULE_6_1_B"
    name: "Generic or Common Name of Commodity"
    clause: "Rule 6(1)(b)"
    act_section: "Section 36(1)"
    category: "Principal Display Panel"
    importance: "HIGH"
    description: "The generic or common name of the commodity contained in the package must be prominently stated on the Principal Display Panel (PDP)."
    requirements:
      - "Must clearly state the commodity name (e.g., 'Basmati Rice', 'Refined Sunflower Oil', 'Face Moisturizer', 'Biscuits')"
      - "Must not be misleading or disguised under arbitrary trade names"
    penalty: "Section 36(1) - Fine up to ₹25,000 for first offence."

  - id: "RULE_6_1_C"
    name: "Net Quantity in Standard SI Units"
    clause: "Rule 6(1)(c) & Rule 11 & Schedule II"
    act_section: "Section 36(1) & Section 36(2)"
    category: "Mandatory Declaration"
    importance: "CRITICAL"
    description: "The net quantity in terms of standard unit of weight or measure or number must be declared."
    requirements:
      - "Must use standard SI symbols: 'g', 'kg', 'ml', 'mL', 'l', 'L', 'cm', 'm', 'N', 'U'"
      - "Strictly prohibited non-standard symbols: 'gm', 'gms', 'GM', 'GMS', 'KG.', 'kgs', 'ml.', 'ltrs', 'nos'"
      - "Dual quantity required for multi-piece / grouped packages (e.g. '10 N x 20 g = 200 g')"
    penalty: "Section 36(1) & 36(2) - Non-standard units/weights constitute a cognizable violation. Fine up to ₹25,000 and possible seizure of non-compliant inventory."

  - id: "RULE_6_1_D"
    name: "Month & Year of Manufacture / Packing / Import"
    clause: "Rule 6(1)(d)"
    act_section: "Section 36(1)"
    category: "Traceability & Consumer Safety"
    importance: "HIGH"
    description: "The month and year in which the commodity is manufactured, packed or imported shall be declared on the package."
    requirements:
      - "Must display valid date format (e.g., '03/2026', 'Mar 2026', '03/26', 'Mfg Date: ...')"
      - "Product must not be expired or past best-before date at the time of retail offer"
    penalty: "Section 36(1) - Fine up to ₹25,000 for first offence."

  - id: "RULE_6_1_E"
    name: "Maximum Retail Price (MRP) & Tax Inclusivity"
    clause: "Rule 6(1)(e)"
    act_section: "Section 36(1)"
    category: "Pricing & Fair Trade"
    importance: "CRITICAL"
    description: "The Maximum Retail Price (MRP) inclusive of all taxes must be clearly declared in Indian Rupees."
    requirements:
      - "Must state numerical price preceded by 'MRP' and '₹' or 'Rs.'"
      - "Must mandatorily contain the phrase 'inclusive of all taxes' or 'incl. of all taxes'"
      - "For packages > 1kg / 1L, Unit Sale Price (USP) per g/ml/piece is mandatory (2022 Amendment)"
    penalty: "Section 36(1) - Selling without MRP or without 'inclusive of all taxes' declaration is punishable with fine up to ₹25,000."

  - id: "RULE_6_1_N"
    name: "Consumer Grievance Redressal / Care Details"
    clause: "Rule 6(1)(n)"
    act_section: "Section 36(1)"
    category: "Consumer Protection"
    importance: "CRITICAL"
    description: "Name, address, telephone number and e-mail address of the person/officer who can be contacted in case of consumer complaints."
    requirements:
      - "Mandatory 4-element check: Contact Designation/Name, Postal Address, Phone/Toll-free number, and Email address"
    penalty: "Section 36(1) - Fine up to ₹25,000 for first offence."

  - id: "RULE_6_10"
    name: "Country of Origin Declaration"
    clause: "Rule 6(10)"
    act_section: "Section 36(1)"
    category: "Trade Transparency"
    importance: "HIGH"
    description: "The country of origin or manufacturer shall be mentioned on imported packages, as well as domestic packages."
    requirements:
      - "Clear declaration: 'Country of Origin: [Country]', 'Made in [Country]', or 'Product of [Country]'"
    penalty: "Section 36(1) - Fine up to ₹25,000 for first offence."

  - id: "RULE_7_SCHED_I"
    name: "Minimum Font Height & Character Size"
    clause: "Rule 7 & Schedule I"
    act_section: "Section 36(1)"
    category: "Readability & Legibility"
    importance: "MEDIUM"
    description: "Declarations must be legible, prominent, and maintain minimum character height in millimeters relative to Net Quantity or Area of Principal Display Panel."
    requirements:
      - "Net Qty <= 50g/ml: Min height 1.0 mm (Blown/Moulded: 2.0 mm)"
      - "50g/ml < Qty <= 200g/ml: Min height 2.0 mm (Blown/Moulded: 4.0 mm)"
      - "200g/ml < Qty <= 1000g/ml: Min height 4.0 mm (Blown/Moulded: 6.0 mm)"
      - "Qty > 1000g/ml: Min height 6.0 mm (Blown/Moulded: 8.0 mm)"
    penalty: "Section 36(1) - Illegible or undersized lettering violates packaging norms. Subject to gauge verification."

  - id: "RULE_18_2"
    name: "Prohibition on Sticker Over-Writing / Price Tampering"
    clause: "Rule 18(2)"
    act_section: "Section 36(1) & Rule 18(2)"
    category: "Anti-Tampering"
    importance: "CRITICAL"
    description: "No person shall alter, smudge, overwrite, or affix individual price stickers on the printed MRP unless authorized under statutory exception."
    requirements:
      - "MRP must be indelibly printed or part of original packaging"
      - "No secondary stickers masking lower printed prices"
    penalty: "Rule 18(2) & Section 36(1) - Unauthorized price alteration is a severe offence subject to seizure and compounding penalty."

  - id: "SEC_15_CLAIM_AUDIT"
    name: "Product Composition & Active Claim Verification"
    clause: "Section 15 & FSSAI / BIS Alignment"
    act_section: "Section 15 of Legal Metrology Act"
    category: "Laboratory Verification"
    importance: "HIGH"
    description: "Specific numerical claims (e.g., '20% Vitamin C', '24g Protein', '100% Pure Badam Oil') must correspond to declared ingredients and are flagged for chemical analysis."
    requirements:
      - "Front panel claims must align with mandatory ingredients list on reverse panel"
      - "Non-conforming or unsubstantiated percentage claims are referred to Government Testing Laboratory"
    penalty: "Section 15 - Power to inspect and sample commodity for laboratory testing."
